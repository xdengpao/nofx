version: '3.8'

services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ${NOFX_RUNTIME_HOST_PATH:-./runtime}:/app/runtime
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
      - NOFX_STORAGE_ROOT=${NOFX_CONTAINER_STORAGE_ROOT:-/app/runtime}
      - NOFX_CONTAINER_STORAGE_ROOT=${NOFX_CONTAINER_STORAGE_ROOT:-/app/runtime}
      - NOFX_RUNTIME_HOST_PATH=${NOFX_RUNTIME_HOST_PATH:-./runtime}
      - NOFX_DRL_TRAIN_API_ENABLED=${NOFX_DRL_TRAIN_API_ENABLED:-false}
      - NOFX_DRL_TRAIN_PYTHON_BIN=${NOFX_DRL_TRAIN_PYTHON_BIN:-python3}
      - NOFX_STORAGE_DISK_TOTAL_BYTES=${NOFX_STORAGE_DISK_TOTAL_BYTES:-}
      - NOFX_STORAGE_DISK_FREE_BYTES=${NOFX_STORAGE_DISK_FREE_BYTES:-}
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    volumes:
      - ${NOFX_FRONTEND_HTPASSWD_PATH:-./nginx/.htpasswd.example}:/etc/nginx/.htpasswd:ro
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
